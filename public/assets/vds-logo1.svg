<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" fill="none" aria-label="Vision Detection Systems">
  <!-- Camera lens / eye mark on the left -->
  <g transform="translate(0,0)">
    <!-- Top dark dome (camera body/eyebrow) -->
    <path d="M 35 120 A 105 105 0 0 1 245 120 L 220 120 A 80 80 0 0 0 60 120 Z" fill="#2C2C2A"/>
    <!-- Bottom orange wing -->
    <path d="M 245 120 A 105 105 0 0 1 35 120 L 60 120 A 80 80 0 0 0 200 138 L 0 138 L 0 168 L 196 168 A 105 105 0 0 1 35 120 Z" fill="#E8621A"/>
    <!-- Inner ring -->
    <circle cx="140" cy="120" r="42" fill="none" stroke="#2C2C2A" stroke-width="5"/>
    <!-- Center pupil with orange dot + ring -->
    <circle cx="140" cy="120" r="22" fill="none" stroke="#E8621A" stroke-width="5"/>
    <circle cx="140" cy="120" r="10" fill="#E8621A"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(270, 0)">
    <text x="0" y="115" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="600" fill="#2C2C2A" letter-spacing="-0.02em">Vision Detection</text>
    <text x="0" y="180" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#E8621A" letter-spacing="-0.02em">Systems</text>
  </g>
</svg>
