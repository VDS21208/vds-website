backend:
  name: github
  repo: VDS21208/vds-website
  branch: main
  base_url: https://vds-website-omega.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

publish_mode: editorial_workflow
media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"
site_url: https://vds-website-omega.vercel.app
display_url: vds-website-omega.vercel.app
logo_url: https://vds-website-omega.vercel.app/assets/vds-logo.svg

search: true

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "singletons"
    label: "📄 Top-level pages"
    label_singular: "page"
    description: "Homepage, About, Contact, Pricing hubs, Answers, Glossary — standalone pages outside collections."
    folder: "src/content/pages/singletons"
    extension: "md"
    format: "frontmatter"
    create: false
    delete: false
    slug: "{{slug}}"
    identifier_field: "h1"
    summary: "{{h1}}  ·  {{url}}"
    fields: &page_fields
      - { label: "🔗 URL (don't change)", name: "url", widget: "string", required: true, hint: "Live URL of this page. Editing here breaks routing." }
      - { label: "Collection (auto)", name: "collection", widget: "hidden" }
      - { label: "Page type", name: "pageType", widget: "string", required: false }
      - { label: "Parent section", name: "parent", widget: "string", required: false }
      - { label: "📅 Status", name: "status", widget: "select", options: ["Launch", "Expansion"], default: "Launch", hint: "Launch = ship in Phase 1. Expansion = Phase 2." }
      - { label: "─── SEO ───", name: "_seo_divider", widget: "hidden", default: "" }
      - { label: "SEO title (≤60)", name: "seoTitle", widget: "string", required: true, pattern: ['^.{1,60}$', "Max 60 characters"] }
      - { label: "Meta description (≤155)", name: "metaDescription", widget: "text", required: true, pattern: ['^.{1,155}$', "Max 155 characters"] }
      - { label: "Tags / keywords", name: "tags", widget: "text", required: false }
      - { label: "Schema type", name: "schemaType", widget: "select", options: ["Article","Product","Service","LocalBusiness","FAQPage","BlogPosting","Organization"], default: "Article" }
      - { label: "─── Hero ───", name: "_hero_divider", widget: "hidden", default: "" }
      - { label: "Announcement bar (optional)", name: "announcementBar", widget: "string", required: false }
      - { label: "H1 headline", name: "h1", widget: "string", required: true }
      - { label: "Hero eyebrow", name: "heroEyebrow", widget: "string", required: false }
      - { label: "Hero subhead", name: "heroSubhead", widget: "text", required: false }
      - label: "Hero CTA — primary"
        name: "heroCTAPrimary"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - label: "Hero CTA — secondary"
        name: "heroCTASecondary"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - label: "Hero stats / badges (max 4)"
        name: "heroStats"
        widget: "list"
        required: false
        max: 4
        collapsed: true
        field: { label: "Stat", name: "value", widget: "string", hint: "Format: 'value · label' (e.g., '$1,500/mo · Starting price')" }
      - { label: "Hero image (uploaded)", name: "heroImage", widget: "image", required: false, allow_multiple: false }
      - { label: "─── FAQ ───", name: "_faq_divider", widget: "hidden", default: "" }
      - label: "FAQ items"
        name: "faq"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.q}}"
        fields:
          - { label: "Question", name: "q", widget: "string" }
          - { label: "Answer", name: "a", widget: "markdown" }
      - { label: "─── Final CTA strip ───", name: "_fcta_divider", widget: "hidden", default: "" }
      - { label: "Final CTA heading", name: "finalCTAHeading", widget: "string", required: false }
      - { label: "Final CTA body", name: "finalCTABody", widget: "text", required: false }
      - label: "Final CTA buttons"
        name: "finalCTAButtons"
        widget: "list"
        required: false
        max: 3
        collapsed: true
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - { label: "─── Advanced ───", name: "_adv_divider", widget: "hidden", default: "" }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
      - { label: "OG title", name: "ogTitle", widget: "string", required: false }
      - { label: "OG description", name: "ogDescription", widget: "text", required: false }
      - { label: "OG image", name: "ogImage", widget: "image", required: false }
      - { label: "OG type", name: "ogType", widget: "select", options: ["website","article","product"], default: "website" }
      - { label: "Robots", name: "robots", widget: "string", default: "index, follow" }
      - { label: "Speakable selectors (AEO)", name: "speakable", widget: "string", required: false }
      - { label: "Author", name: "author", widget: "string", default: "Vision Detection Systems" }
      - { label: "Internal links (comma-separated)", name: "internalLinks", widget: "text", required: false }
      - { label: "Internal notes", name: "notes", widget: "text", required: false }
      - { label: "─── Body content ───", name: "_body_divider", widget: "hidden", default: "" }
      - { label: "Body (Markdown)", name: "body", widget: "markdown" }

