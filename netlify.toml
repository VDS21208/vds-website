[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.10"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# 301 redirects from old visiondetectionsystems.com URLs
# Auto-generated mapping from src/data/redirects.json
# Run scripts/sync-netlify-redirects.mjs after build to refresh this list

[[redirects]]
  from = "/request-quote/"
  to = "/request-a-quote"
  status = 301
  force = true

